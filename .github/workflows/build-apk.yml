name: Build SharkMentor Mark 71 APK

on:
  push:
    branches:
      - main
      - mark-57
      - mark-59
      - mark-60
      - mark-61
      - mark-62
      - mark-63
      - mark-65
      - mark-67
      - mark-69
      - mark-70
      - mark-71
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build-debug-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate local.properties from GitHub Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          def clean_val(v: str) -> str:
              return (v or "").replace("\r", "").replace("\n", "").replace('"', "").replace("'", "").replace("\\", "").strip()

          sdk_dir = os.environ.get("ANDROID_HOME", "")
          g_single = clean_val(os.environ.get("GEMINI_API_KEY", ""))
          g_multi_raw = os.environ.get("GEMINI_API_KEYS", "") or ""
          multi_parts = [clean_val(p) for p in re.split(r"[,;\s]+", g_multi_raw) if clean_val(p)]
          all_gemini = []
          for k in (multi_parts + ([g_single] if g_single else [])):
              if k and k not in all_gemini:
                  all_gemini.append(k)

          g_multi = ",".join(all_gemini)
          g_primary = g_single or (all_gemini[0] if all_gemini else "")
          deepseek = clean_val(os.environ.get("DEEPSEEK_API_KEY", ""))
          kimi = clean_val(os.environ.get("KIMI_API_KEY", ""))

          lines = [
              f"sdk.dir={sdk_dir}",
              f"GEMINI_API_KEY={g_primary}",
              f"GEMINI_API_KEYS={g_multi}",
              f"DEEPSEEK_API_KEY={deepseek}",
              f"KIMI_API_KEY={kimi}",
          ]
          with open("local.properties", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          lens = [len(k) for k in all_gemini]
          summary = (
              f"Secrets check -> GEMINI keys={len(all_gemini)} lens={lens}, "
              f"DEEPSEEK configured={bool(deepseek)} (len={len(deepseek)}), "
              f"KIMI configured={bool(kimi)} (len={len(kimi)})"
          )
          print(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write(f"### 🔐 Build Secret Injection Status\n{summary}\n")
          PYEOF

      - name: Run Unit Tests & Build Debug APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee test.log
          TEST_EXIT=${PIPESTATUS[0]}
          if [ $TEST_EXIT -eq 0 ]; then
            ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
            BUILD_EXIT=${PIPESTATUS[0]}
          else
            cp test.log build.log
            BUILD_EXIT=$TEST_EXIT
          fi
          set -e
          if [ $BUILD_EXIT -ne 0 ] || [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== KOTLIN COMPILER / TEST ERRORS ===" > error_summary.txt
            grep -E "e: |FAILURE:|What went wrong:|^\* |> Task .* FAILED|FAILED$" build.log >> error_summary.txt || true
            echo "=== TAIL OF BUILD LOG ===" >> error_summary.txt
            tail -n 60 build.log >> error_summary.txt
            python3 - << 'PYEOF'
          import subprocess, os
          content = open("error_summary.txt", errors="ignore").read()[:14000]
          body = "### ❌ Build / Test Diagnostic Log\n```\n" + content + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"], check=False)
          PYEOF
            exit 1
          fi

      - name: Align (16KB), Re-Sign (v1+v2+v3) & Verify APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          # Align uncompressed .so to 16KB (-P 16) and resources.arsc to 4-byte boundary BEFORE signing
          "$ZIPALIGN" -f -P 16 4 "$APK" "${APK}.aligned"
          "$APKSIGNER" sign \
            --ks app/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "${APK}.signed" \
            "${APK}.aligned"
          rm -f "${APK}.aligned"
          mv "${APK}.signed" "$APK"

          APK_BYTES=$(wc -c < "$APK")
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')

          set +e
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 21 "$APK" > apksigner_out.txt 2>&1
          APKSIGNER_EXIT=$?

          "$ZIPALIGN" -c -P 16 -v 4 "$APK" > zipalign_out.txt 2>&1
          ZIPALIGN_EXIT=$?
          set -e

          V1_OK=$(grep -c "Verified using v1 scheme (JAR signing): true" apksigner_out.txt || true)
          V2_OK=$(grep -c "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner_out.txt || true)
          V3_OK=$(grep -c "Verified using v3 scheme (APK Signature Scheme v3): true" apksigner_out.txt || true)

          RESOURCES_INFO=$(unzip -v "$APK" | grep -E "resources\.arsc" || echo "resources.arsc not found")
          TEST_ONLY=$( "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -E "testOnly|minSdkVersion|targetSdkVersion|versionCode|versionName|extractNativeLibs|isSplitRequired|debuggable|compileSdkVersionCodename" || true )
          BADGING=$("$AAPT2" dump badging "$APK" | head -n 5 || true)

          CODENAME_VAL=$(echo "$BADGING" | sed -n "s/.*compileSdkVersionCodename='\([^']*\)'.*/\1/p" | head -n 1)
          CODENAME_FOUND=0
          if [ -n "$CODENAME_VAL" ] && ! echo "$CODENAME_VAL" | grep -qE "^([0-9]+(\.[0-9]+)*|REL)$"; then
            CODENAME_FOUND=1
          fi
          TEST_ONLY_FOUND=0
          if echo "$TEST_ONLY" | grep -qiE "testOnly.*(true|0xffffffff)"; then
            TEST_ONLY_FOUND=1
          fi
          RESOURCES_MISSING=0
          if [ "$RESOURCES_INFO" = "resources.arsc not found" ] || [ -z "$RESOURCES_INFO" ]; then
            RESOURCES_MISSING=1
          fi

          rm -rf /tmp/so_check && mkdir -p /tmp/so_check
          unzip -q "$APK" "lib/*" -d /tmp/so_check 2>/dev/null || true
          SO_REPORT=""
          UNALIGNED_4KB=0
          while IFS= read -r -d '' sofile; do
            ALIGNS=$(readelf -lW "$sofile" 2>/dev/null | awk '$1 == "LOAD" {print $NF}' | sort -u | tr '\n' ' ')
            REL_SO=${sofile#/tmp/so_check/}
            if echo "$ALIGNS" | grep -qE "0x1000([^0-9a-fA-F]|$)|0x800([^0-9a-fA-F]|$)|0x400([^0-9a-fA-F]|$)"; then
              SO_REPORT="${SO_REPORT}FAIL_4KB: ${REL_SO} -> LOAD align: ${ALIGNS}\n"
              UNALIGNED_4KB=1
            else
              SO_REPORT="${SO_REPORT}OK: ${REL_SO} -> LOAD align: ${ALIGNS}\n"
            fi
          done < <(find /tmp/so_check -name "*.so" -print0 | sort -z)

          if [ -z "$SO_REPORT" ]; then
            SO_REPORT="(No native .so libraries in APK)"
          fi

          {
            echo "### 📦 APK Verification Report"
            echo "- **Size:** ${APK_BYTES} bytes"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
            echo "- **apksigner exit:** ${APKSIGNER_EXIT} (v1=${V1_OK}, v2=${V2_OK}, v3=${V3_OK})"
            echo "- **zipalign -P 16 exit:** ${ZIPALIGN_EXIT}"
            echo "- **Unaligned 4KB 64-bit .so detected:** ${UNALIGNED_4KB}"
            echo "- **Preview codename flag:** ${CODENAME_FOUND}"
            echo "- **testOnly flag:** ${TEST_ONLY_FOUND}"
            echo "- **resources.arsc missing:** ${RESOURCES_MISSING}"
            echo ""
            echo "#### apksigner verify"
            echo '```'
            cat apksigner_out.txt
            echo '```'
            echo "#### aapt2 badging & manifest flags"
            echo '```'
            echo "$BADGING"
            echo "$TEST_ONLY"
            echo "resources.arsc: $RESOURCES_INFO"
            echo '```'
            echo "#### Native .so ELF LOAD alignment (readelf -l)"
            echo '```'
            printf "%b" "$SO_REPORT"
            echo '```'
            echo "#### zipalign -c -P 16 tail"
            echo '```'
            tail -n 20 zipalign_out.txt
            echo '```'
          } > verify_report.md

          cat verify_report.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat verify_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          python3 - << 'PYEOF'
          import subprocess, os
          body = open("verify_report.md", errors="ignore").read()[:60000]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"], check=False)
          PYEOF

          if [ "$APKSIGNER_EXIT" -ne 0 ] || [ "$V1_OK" -lt 1 ] || [ "$V2_OK" -lt 1 ] || [ "$V3_OK" -lt 1 ]; then
            echo "apksigner verification failed! (exit=$APKSIGNER_EXIT, v1=$V1_OK, v2=$V2_OK, v3=$V3_OK)"
            exit 1
          fi
          if [ "$ZIPALIGN_EXIT" -ne 0 ] || [ "$UNALIGNED_4KB" -ne 0 ]; then
            echo "16KB alignment check failed! (zipalign=$ZIPALIGN_EXIT, unaligned_4kb=$UNALIGNED_4KB)"
            exit 1
          fi
          if [ "$CODENAME_FOUND" -ne 0 ] || [ "$TEST_ONLY_FOUND" -ne 0 ] || [ "$RESOURCES_MISSING" -ne 0 ]; then
            echo "Manifest/resource packaging verification failed! (codename=$CODENAME_FOUND, testOnly=$TEST_ONLY_FOUND, resMissing=$RESOURCES_MISSING)"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharkMentor-Mark71-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Mobile APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SharkMentor-Mark71-debug.apk
          gh release delete mark71-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create mark71-apk SharkMentor-Mark71-debug.apk \
            --title "Shark Mentor Study Mark 71 (Debug APK)" \
            --notes "Mark 71 sürümü: İçe aktarılan playlist videolarını tekil silme, sıfırlanan çalışma başlığı & gerçek metin senkronizasyonu, arka planda/kilitli ekranda medya bildirimli video oynatma, gerçek Not/PDF özeti Podcast motoru, Ana Ekran solunda 5 temalı (Default, Modern Vinyl, Classic Vinyl, CD, Cassette) dönen plaklı Müzik & Zen çalar, konuma/saate duyarlı Tema Döngüsü + Mavi Işık Filtresi ve Kronometre ekran açık tutma seçeneği."
